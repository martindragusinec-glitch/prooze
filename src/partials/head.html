<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{robots}}<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#0F3A2E">
<link rel="icon" href="{{root}}assets/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{root}}assets/brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{root}}assets/brand/apple-touch-icon.png">
<link rel="manifest" href="{{root}}site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:locale" content="cs_CZ">
<meta property="og:site_name" content="PROOZE">
<meta property="og:url" content="{{canonical}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{domain}}/assets/img/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:alt" content="Rodinný dům s černými solárními panely, nápis Střechy a FVE a Pokrývači, kteří umí i fotovoltaiku">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{domain}}/assets/img/og.jpg">
<script>if(!matchMedia("(prefers-reduced-motion: reduce)").matches){document.documentElement.classList.add("motion");setTimeout(function(){if(!window.__motionOK)document.documentElement.classList.remove("motion")},3000)}</script>
<link rel="preload" href="{{root}}assets/fonts/FunnelDisplay-normal-500-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{root}}assets/fonts/FunnelSans-normal-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}assets/fonts/fonts.css">
{{preload}}<link rel="stylesheet" href="{{root}}assets/site.css">
{{tracking}}{{jsonld}}
</head>
